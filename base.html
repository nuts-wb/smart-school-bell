<!doctype html>
<html lang="{{ lang }}" data-theme="{{ theme }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf" content="{{ csrf }}">
  <title>Smart School Bell</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;500;600&family=Playfair+Display:wght@700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body class="{% block bodyclass %}{% endblock %}">
<div class="phone" id="phone">
  {% block content %}{% endblock %}

  {% if user %}
  <!-- dialog konfirmasi bersama (gaya sama dengan "Bunyikan Bel Sekarang?") -->
  <div class="modal fade" id="confirmModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered"><div class="modal-content ssb-dialog text-center">
      <h5 id="confirmTitle"></h5><p id="confirmDesc"></p>
      <div class="dlg-actions">
        <button type="button" class="btn-ssb-outline" data-bs-dismiss="modal">{{ t('batal') }}</button>
        <button type="button" class="btn-ssb-red" id="confirmOk"></button>
      </div>
    </div></div>
  </div>
  <div class="ssb-toasts" id="toasts"></div>
  <div class="ssb-flash" id="flash"></div>
  {% endif %}
</div>
<script>
  window.APP = {
    csrf: {{ csrf|tojson }}, lang: {{ lang|tojson }}, tz: {{ tz_name|tojson }}, T: {{ T|tojson }},
    user: {{ ({'id': user['id'], 'role': user['role']} if user else None)|tojson }}
  };
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/modal-shim.js') }}"></script>
{% if user %}<script src="{{ url_for('static', filename='js/app.js') }}"></script>{% endif %}
{% block scripts %}{% endblock %}
</body>
</html>
